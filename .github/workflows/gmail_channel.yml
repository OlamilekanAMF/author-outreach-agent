name: Gmail Secondary Channel — Daily Author Outreach

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 11 AM UTC Mon-Fri (12 PM Lagos time)
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  trigger-gmail:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail Agent on Render
        run: |
          echo "Triggering Gmail channel agent..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://outreach-agent-eo4a.onrender.com/run/gmail" \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Response status: $status"
          echo "Response body: $body"

          if [ "$status" -eq 200 ] || [ "$status" -eq 202 ]; then
            echo "✅ Gmail agent triggered successfully!"
          else
            echo "❌ Failed to trigger Gmail agent (HTTP $status)"
            exit 1
          fi
