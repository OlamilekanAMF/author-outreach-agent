name: Rejoicebookclub Outreach Agent

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 10 AM UTC Mon-Fri (11 AM Lagos time)
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  trigger-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Main Agent on Render
        run: |
          echo "Triggering main outreach agent..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://outreach-agent-eo4a.onrender.com/run/agent" \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Response status: $status"
          echo "Response body: $body"

          if [ "$status" -eq 200 ] || [ "$status" -eq 202 ]; then
            echo "✅ Agent triggered successfully!"
          else
            echo "❌ Failed to trigger agent (HTTP $status)"
            exit 1
          fi
